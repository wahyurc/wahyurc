<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      HyperFrames segment (film time 20.15s -> 23.60s)
      Scene 12: website UI "Go beyond templates."
      Scene 13: kinetic typography "start!!!!" -> "Creating" -> "Real" -> "videos"
    -->
    <script src="./assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Rubik"; font-weight: 700; src: url(./assets/rubik-latin-700-normal.woff2); }
      @font-face { font-family: "Rubik"; font-weight: 800; src: url(./assets/rubik-latin-800-normal.woff2); }
      @font-face { font-family: "Rubik"; font-weight: 900; src: url(./assets/rubik-latin-900-normal.woff2); }
      :root {
        --cream: #f4ece2;
        --cream2: #efe4d6;
        --orange: #ff6a1a;
        --orange-d: #e9530d;
        --ink: #1f1a17;
        --brown: #7a3410;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .scene { background: radial-gradient(ellipse at 50% 50%, #f8f2ea 0%, var(--cream) 55%, var(--cream2) 100%); }

      /* ---------- Scene 12 : website ---------- */
      #whip { display: flex; align-items: center; justify-content: center; }
      .whipcard { position: absolute; width: 360px; height: 220px; border-radius: 22px; background: linear-gradient(135deg, #ff8a3d, var(--orange-d)); filter: blur(10px); opacity: .9; }
      #sidebar { position: absolute; left: 0; top: 0; width: 196px; height: 1080px; background: #ede3d6; border-right: 1px solid #e0d3c3; padding: 30px 24px; }
      .brand { display: flex; gap: 10px; align-items: center; margin-bottom: 34px; }
      .brand .logo { width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(160deg, #ffc93c, var(--orange)); }
      .brand b { font-size: 14px; display: block; }
      .brand small { font-size: 10px; color: #8a7b6c; }
      .nav { list-style: none; }
      .nav li { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; height: 44px; color: #3b322b; }
      .nav i { width: 16px; height: 16px; border: 2px solid #5b4f45; border-radius: 4px; display: inline-block; }
      .nav li:nth-child(3) i, .nav li:nth-child(5) i { border-radius: 50%; }
      .btn { position: absolute; left: 24px; width: 148px; height: 40px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
      .btn.ghost { bottom: 82px; background: #f3ebe1; border: 1px solid #d8cabb; }
      .btn.buy { bottom: 30px; background: var(--orange); color: #fff; background-image: radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.4px); background-size: 4px 4px; }
      #scrollbar { position: absolute; right: 70px; top: 300px; width: 2px; height: 260px; background: #d9ccbc; }
      #scrollbar::after { content: ""; position: absolute; left: -1px; top: 80px; width: 4px; height: 30px; background: #bcae9e; border-radius: 2px; }
      #headline { position: absolute; left: 196px; right: 0; top: 368px; text-align: center; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
      #headline .or { color: var(--orange); }
      #thumbs { position: absolute; left: 196px; right: 0; top: 452px; display: flex; justify-content: center; gap: 14px; }
      .th { width: 106px; height: 150px; border-radius: 4px; background: #fff; box-shadow: 0 6px 14px rgba(120,70,30,.18); position: relative; overflow: hidden; }
      .th.o { background: var(--orange); }
      .th::before { content: ""; position: absolute; left: 12px; right: 12px; top: 14px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.18); }
      .th::after { content: ""; position: absolute; left: 18px; right: 18px; top: 46px; height: 70px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
      .th.w::after { background: repeating-linear-gradient(#e8e0d6 0 6px, transparent 6px 14px); border-radius: 2px; }
      #swoosh { position: absolute; left: 0; top: 0; }
      #pills { position: absolute; left: 196px; right: 0; top: 622px; display: flex; justify-content: center; gap: 18px; }
      .pill { padding: 9px 22px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 16px; font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }

      /* ---------- Scene 13 : kinetic type ---------- */
      .center { display: flex; align-items: center; justify-content: center; }
      #startOrange { background: radial-gradient(circle at 50% 50%, #f7a77c 0%, #e98055 45%, #d9653b 100%); }
      #startOrange h1 { color: #fff; font-family: Rubik; font-weight: 800; font-size: 150px; letter-spacing: -0.03em; }
      .stairs { position: absolute; right: 0; top: 0; width: 460px; height: 90px; }
      .stairs span { position: absolute; top: 0; background: var(--brown); }
      #startHalf { background-color: #fbe3d2; background-image: radial-gradient(#ff7b36 32%, transparent 34%); background-size: 22px 22px; }
      #startHalf h1 { color: #1a1310; font-family: Rubik; font-weight: 800; font-size: 120px; letter-spacing: -0.03em; position: relative; }
      #doodles { position: absolute; inset: 0; }
      #startPlain h1 { color: #1b1512; font-family: Rubik; font-weight: 800; font-size: 120px; letter-spacing: -0.03em; }
      #oSquare { position: absolute; width: 38px; height: 38px; border-radius: 6px; background: var(--orange); left: 1500px; top: 520px; }
      #creating span { font-size: 54px; font-weight: 600; letter-spacing: -0.02em; }
      #dot { position: absolute; left: 842px; top: 534px; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); }
      #realWrap { overflow: hidden; }
      #real { position: absolute; top: 90px; left: 0; font-family: Rubik; font-weight: 800; font-size: 1080px; line-height: 0.9; color: var(--orange); letter-spacing: -0.04em; white-space: nowrap; }
      #videos span { font-size: 44px; font-weight: 600; color: var(--orange); letter-spacing: -0.01em; }
      .grain { position: absolute; inset: 0; pointer-events: none; opacity: .06; background-image: radial-gradient(#000 0.6px, transparent 0.8px); background-size: 3px 3px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.45" data-width="1920" data-height="1080">

      <!-- 20.15 - 20.35 : blurred card stack whip -->
      <div id="whip" class="clip scene" data-start="0" data-duration="0.22" data-track-index="0">
        <div class="whipcard" style="transform: translate(-60px,-20px) rotate(-8deg)"></div>
        <div class="whipcard" style="transform: translate(0,0) rotate(-4deg)"></div>
        <div class="whipcard" style="transform: translate(60px,20px)"></div>
      </div>

      <!-- 20.35 - 21.45 : website UI -->
      <div id="site" class="clip scene" data-start="0.2" data-duration="1.12" data-track-index="1">
        <aside id="sidebar">
          <div class="brand"><div class="logo"></div><div><b>w4hy03</b><small>ebook</small></div></div>
          <ul class="nav">
            <li><i></i>Install</li><li><i></i>Tools</li><li><i></i>Remotion</li>
            <li><i></i>three.js</li><li><i></i>Blender</li><li><i></i>Phone</li>
          </ul>
          <div class="btn ghost">Read Chapter 10</div>
          <div class="btn buy">Buy now</div>
        </aside>
        <div id="scrollbar"></div>
        <div id="headline"><span id="hGo">Go </span><span id="hBeyond" class="or">beyond</span><span id="hTpl"> templates.</span></div>
        <div id="thumbs">
          <div class="th w"></div><div class="th o"></div><div class="th w"></div><div class="th o"></div><div class="th o"></div>
        </div>
        <svg id="swoosh" width="1920" height="1080"><path id="swPath" d="M 1020 690 Q 1300 740 1560 650" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M 1560 650 l 70 -14" stroke="#ff6a1a" stroke-width="8" stroke-linecap="round"/></svg>
        <div id="pills">
          <div class="pill">HyperFrames</div><div class="pill">Remotion</div><div class="pill">three.js</div><div class="pill">Blender</div><div class="pill">AI</div>
        </div>
      </div>

      <!-- 21.45 - 21.6 : blank breath -->
      <div id="blank" class="clip scene" data-start="1.3" data-duration="0.16" data-track-index="0"></div>

      <!-- 21.6 - 21.75 : start!!!! on orange -->
      <div id="startOrange" class="clip center" data-start="1.45" data-duration="0.16" data-track-index="0">
        <div class="stairs"><span style="right:0;width:460px;height:28px"></span><span style="right:0;width:330px;height:52px"></span><span style="right:0;width:200px;height:76px"></span><span style="right:0;width:90px;height:90px"></span></div>
        <h1>start!!!!</h1>
      </div>

      <!-- 21.75 - 21.95 : halftone doodles -->
      <div id="startHalf" class="clip center" data-start="1.6" data-duration="0.2" data-track-index="0">
        <svg id="doodles" width="1920" height="1080" fill="none" stroke="#e8571a" stroke-width="7" stroke-linejoin="round">
          <rect x="180" y="250" width="300" height="190" transform="rotate(-12 330 345)"/>
          <rect x="1350" y="140" width="330" height="200" transform="rotate(8 1515 240)"/>
          <rect x="1180" y="600" width="260" height="170" transform="rotate(-6 1310 685)"/>
          <rect x="380" y="690" width="210" height="140" transform="rotate(14 485 760)"/>
          <rect x="1560" y="760" width="180" height="120" transform="rotate(-18 1650 820)"/>
          <polyline points="60,560 140,500 220,580 300,500 380,580"/>
          <polyline points="1480,520 1560,460 1640,540 1720,460 1800,540 1880,480"/>
          <polyline points="700,120 780,170 860,110 940,170"/>
          <path d="M 860 900 Q 960 820 1060 900 T 1260 900"/>
        </svg>
        <h1>start!!!</h1>
      </div>

      <!-- 21.95 - 22.1 : plain start!!!! + orange square -->
      <div id="startPlain" class="clip center scene" data-start="1.8" data-duration="0.16" data-track-index="0">
        <h1>start!!!!</h1>
        <div id="oSquare"></div>
      </div>

      <!-- 22.1 - 22.5 : •Creating -->
      <div id="creating" class="clip center scene" data-start="1.95" data-duration="0.4" data-track-index="0">
        <span id="creatingTxt">Creating</span>
        <div id="dot"></div>
      </div>

      <!-- 22.5 - 23.1 : giant "Real" pan -->
      <div id="realWrap" class="clip scene" data-start="2.35" data-duration="0.62" data-track-index="0">
        <div id="real">Real</div>
      </div>

      <!-- 23.1 - 23.6 : videos -->
      <div id="videos" class="clip center scene" data-start="2.95" data-duration="0.5" data-track-index="0">
        <span id="videosTxt">videos</span>
      </div>

      <div class="grain clip" data-start="0" data-duration="3.45" data-track-index="5"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // whip stack streaks left -> right
      tl.fromTo("#whip .whipcard", { x: -900, scaleX: 1.8 }, { x: 900, scaleX: 1.2, duration: 0.22, ease: "none", stagger: 0.02 }, 0);

      // website: sidebar slides in, thumbs streak in blurred then settle
      tl.from("#sidebar", { x: -220, duration: 0.25, ease: E }, 0.2);
      tl.from("#scrollbar", { opacity: 0, duration: 0.2 }, 0.3);
      tl.fromTo("#thumbs", { x: 700, scaleX: 2.2, opacity: 0.9, y: -60 }, { x: 0, scaleX: 1, opacity: 1, y: -80, duration: 0.25, ease: "expo.out" }, 0.2);
      tl.fromTo("#swPath", { strokeDasharray: 700, strokeDashoffset: 700, opacity: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: "none" }, 0.28);
      tl.to("#swoosh", { opacity: 0, x: 200, duration: 0.12 }, 0.46);
      tl.to("#thumbs", { y: 0, scale: 0.94, duration: 0.25, ease: E }, 0.45);
      tl.fromTo("#headline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: E }, 0.45);
      tl.set("#hTpl", { opacity: 0 }, 0);
      tl.set("#hBeyond", { color: "#ff6a1a" }, 0.45);
      tl.set("#hBeyond", { color: "#1f1a17" }, 0.65);
      tl.to("#hTpl", { opacity: 1, duration: 0.12 }, 0.82);
      tl.from("#pills .pill", { scale: 0, opacity: 0, duration: 0.18, ease: "back.out(2.5)", stagger: 0.09 }, 0.62);
      tl.to("#site", { opacity: 0, duration: 0.08 }, 1.22);

      // start!!!! orange -> stairs grow
      tl.from(".stairs span", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.12, stagger: 0.02 }, 1.45);
      tl.fromTo("#startOrange h1", { scale: 0.85 }, { scale: 1, duration: 0.16, ease: E }, 1.45);
      tl.fromTo("#doodles", { scale: 1.15, rotation: -3 }, { scale: 1, rotation: 0, duration: 0.2, ease: E }, 1.6);
      tl.fromTo("#startHalf h1", { x: -30 }, { x: 0, duration: 0.2 }, 1.6);
      tl.fromTo("#oSquare", { x: 120, rotation: 30 }, { x: 0, rotation: 0, duration: 0.16, ease: E }, 1.8);

      // •Creating — dot leads in then travels left away from the word
      tl.fromTo("#creatingTxt", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.14, ease: E }, 1.95);
      tl.fromTo("#dot", { scale: 0 }, { scale: 1, duration: 0.08 }, 1.95);
      tl.to("#dot", { x: -75, y: -12, duration: 0.25, ease: "power2.inOut" }, 2.08);
      tl.to("#creating", { x: 70, duration: 0.4, ease: "none" }, 1.95);

      // giant Real: R enters from right, pans left with speed
      tl.fromTo("#real", { x: 1700 }, { x: -1500, duration: 0.62, ease: "power1.in" }, 2.35);

      // videos drifts up-left and fades
      tl.fromTo("#videosTxt", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.12, ease: E }, 2.95);
      tl.to("#videosTxt", { x: -500, y: -200, scale: 0.7, duration: 0.35, ease: "power2.in" }, 3.08);
      tl.to("#videosTxt", { opacity: 0, duration: 0.12 }, 3.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
